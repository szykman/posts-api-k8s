apiVersion: v1
kind: Service
metadata:
  name: posts-db
  namespace: posts
  labels:
    app.kubernetes.io/name: posts-db
spec:
  selector:
    app.kubernetes.io/name: posts-db
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: posts-db
  namespace: posts
  labels:
    app.kubernetes.io/name: posts-db
spec:
  serviceName: posts-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: posts-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: posts-db
    spec:
      containers:
        - name: mariadb
          image: mariadb:10.11
          ports:
            - name: mysql
              containerPort: 3306
          envFrom:
            - secretRef:
                name: posts-db-credentials
          readinessProbe:
            tcpSocket:
              port: mysql
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mysql
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
