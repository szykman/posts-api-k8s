apiVersion: apps/v1
kind: Deployment
metadata:
  name: posts-api
  namespace: posts
  labels:
    app.kubernetes.io/name: posts-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: posts-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: posts-api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: posts-api
      containers:
        - name: api
          image: ghcr.io/szykman/posts-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: TYPEORM_HOST
              value: posts-db
            - name: TYPEORM_PORT
              value: "3306"
            - name: TYPEORM_USERNAME
              valueFrom:
                secretKeyRef: {name: posts-db-credentials, key: MYSQL_USER}
            - name: TYPEORM_PASSWORD
              valueFrom:
                secretKeyRef: {name: posts-db-credentials, key: MYSQL_PASSWORD}
            - name: TYPEORM_DATABASE
              valueFrom:
                secretKeyRef: {name: posts-db-credentials, key: MYSQL_DATABASE}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: posts-api
  namespace: posts
  labels:
    app.kubernetes.io/name: posts-api
spec:
  selector:
    app.kubernetes.io/name: posts-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: posts-api
  namespace: posts
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: posts-api
