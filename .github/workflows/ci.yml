name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

# Read-only by default; the publish job asks for more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test
      # Runtime dependencies only: what ships in the image.
      - run: yarn audit --groups dependencies --level high

  lint:
    name: Dockerfile, chart and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.0
      - run: helm lint helm/posts-api
      - run: shellcheck scripts/*.sh

  e2e:
    name: End to end on kind
    runs-on: ubuntu-latest
    needs: [test, lint]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Same entry point a reviewer uses locally. The chart's default image is already published.
      - run: scripts/bootstrap.sh up
      - run: scripts/bootstrap.sh test
      - if: failure()
        run: |
          kubectl --context kind-posts get pods -A -o wide
          kubectl --context kind-posts -n posts describe pods
          kubectl --context kind-posts -n posts logs --all-containers --tail=100 -l app.kubernetes.io/name=posts-api

  publish:
    name: Publish image
    # Only for version tags. Images are immutable: build.sh refuses to overwrite an existing tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the chart appVersion
        run: |
          version="$(sed -n 's/^appVersion:[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}[[:space:]]*$/\1/p' helm/posts-api/Chart.yaml)"
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "tag ${GITHUB_REF_NAME} does not match appVersion ${version}"; exit 1; }
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/build.sh --push
