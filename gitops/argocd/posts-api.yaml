# Production values (Cloud SQL, cert-manager, a real host): never applied. The trial of 22 October 2026 used the same
# Application with the bundled MariaDB and a self-signed certificate, see docs/GKE.md.
# Argo CD deploys the chart in this repository.
#
# GitOps in one sentence: Git holds the desired state, and Argo CD makes the cluster match it and puts it back if
# someone changes it by hand (selfHeal). A release is a commit (a new targetRevision or image tag), not a command.
#
# What must exist before the first sync, because Secrets never go in Git:
#   - Secret posts-db-credentials and Secret posts-api-token in the namespace "posts" (see docs/GKE.md: created
#     by External Secrets from Secret Manager, or by Sealed Secrets, or by hand for a trial);
#   - cert-manager and a ClusterIssuer named "letsencrypt" (it creates the Secret posts-api-tls);
#   - a DNS record for the host below pointing at the Traefik load balancer.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: posts-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/szykman/posts-api-k8s.git
    # Pin to a tag for a release; "main" would deploy every merge.
    targetRevision: v0.3.2
    path: helm/posts-api
    helm:
      valuesObject:
        image:
          repository: ghcr.io/szykman/posts-api
        ingress:
          className: traefik
          host: posts.example.com   # replace
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt
          tls:
            secretName: posts-api-tls
        # Production database: managed (Cloud SQL private IP, from `terraform output database_private_ip`).
        mariadb:
          enabled: false
        database:
          host: 10.0.0.0   # replace
          existingSecret: posts-db-credentials
        # Argo CD runs `pre-install` and `pre-upgrade` hooks in the PreSync phase, so the migration runs before the
        # new pods. "post-install" (the default for the bundled database) would run after the sync.
        # With the bundled MariaDB under Argo CD use "post-install,post-upgrade" instead: "pre-upgrade" also runs
        # as PreSync on the first sync (Argo cannot tell an install from an upgrade), before the database exists.
        migration:
          hook: "pre-install,pre-upgrade"
  destination:
    server: https://kubernetes.default.svc
    namespace: posts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
